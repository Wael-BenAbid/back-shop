server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:12345}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce
          jwk-set-uri: http://localhost:8080/realms/ecommerce/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://localhost:8080
  realm: ecommerce
  client-id: ecommerce-client
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
  token-url: http://localhost:8080/realms/ecommerce/protocol/openid-connect/token
  admin:
    username: admin
    password: ${KEYCLOAK_ADMIN_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
